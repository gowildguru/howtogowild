<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Disruption Portal Test | How To GoWild!</title>
  <link rel="stylesheet" href="style.css?v=19">
  <style>
    body { margin: 0; min-height: 100vh; background: #354d3d; color: #fff; font-family: "Montserrat", Arial, sans-serif; line-height: 1.6; }
    main { width: min(100% - 32px, 600px); margin: 0 auto; padding: 40px 0; }
    h1 { font-size: clamp(1.8rem, 6vw, 2.7rem); line-height: 1.2; }
    form { padding: 24px; border: 1px solid #ffffff40; border-radius: 26px; background: #ffffff0d; }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    input { display: block; box-sizing: border-box; width: 100%; min-height: 48px; margin-bottom: 20px; padding: 12px 16px; border: 1px solid #ffffff66; border-radius: 14px; background: #fff; color: #26332b; font: inherit; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 999px; padding: 12px 18px; background: #c6e1cf; color: #254432; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    a { color: inherit; text-underline-offset: 3px; }
    :focus-visible { outline: 3px solid #b6d3c0; outline-offset: 4px; }
    .note { font-size: .85rem; color: #ffffffd9; }
    #status { margin: 18px 0 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← Back to How To GoWild!</a>
    <h1>Disruption Portal Test</h1>
    <p class="note">Submitting sends your last name and confirmation code directly to Frontier to open your disruption options. This page does not save your details.</p>
    <form id="portal-form">
      <label for="surname">Last name</label>
      <input id="surname" name="surname" type="text" autocomplete="family-name" maxlength="100" required>
      <label for="pnr">Confirmation code</label>
      <input id="pnr" name="pnr" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" minlength="6" maxlength="6" pattern="[A-Za-z0-9]{6}" title="Enter the six-letter or digit confirmation code." required>
      <button id="submit-button" type="submit">View My Disruption Options</button>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>
    <p class="note">If this test cannot connect, <a href="https://travel.flyfrontier.com/login" rel="noreferrer">open Frontier’s login page</a>.</p>
    <noscript><p>JavaScript is needed for this test. Use the Frontier login link above.</p></noscript>
  </main>
  <script>
    const form = document.getElementById('portal-form');
    const button = document.getElementById('submit-button');
    const status = document.getElementById('status');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (button.disabled) return;
      const surname = document.getElementById('surname').value.trim();
      const pnr = document.getElementById('pnr').value.trim().toUpperCase();
      if (!surname || !/^[A-Z0-9]{6}$/.test(pnr)) {
        status.textContent = 'Enter your last name and six-character confirmation code.';
        return;
      }
      button.disabled = true;
      form.setAttribute('aria-busy', 'true');
      status.textContent = 'Checking with Frontier…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);
      try {
        const response = await fetch('https://travel.flyfrontier.com/portal/session/login', {
          method: 'POST',
          mode: 'cors',
          credentials: 'omit',
          cache: 'no-store',
          referrerPolicy: 'no-referrer',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ surname, pnr }),
          signal: controller.signal
        });
        if (!response.ok) {
          status.textContent = 'Frontier could not complete the lookup (HTTP ' + response.status + '). Try its login page below.';
          return;
        }
        let result;
        try { result = await response.json(); }
        catch {
          status.textContent = 'Frontier returned an unexpected response. Try its login page below.';
          return;
        }
        if (result.status !== 'success' || typeof result.sessionId !== 'string' || !result.sessionId.trim()) {
          status.textContent = 'Frontier did not return a portal session. Check your details or try its login page below.';
          return;
        }
        const destination = new URL('https://travel.flyfrontier.com/pnr/intro');
        destination.searchParams.set('portalKey', result.sessionId);
        status.textContent = 'Opening Frontier’s disruption portal…';
        window.location.assign(destination.href);
      } catch (error) {
        status.textContent = error.name === 'AbortError'
          ? 'The connection timed out. Try Frontier’s login page below.'
          : 'This browser could not connect to Frontier. Cross-site requests may be blocked. Try Frontier’s login page below.';
      } finally {
        clearTimeout(timeout);
        button.disabled = false;
        form.removeAttribute('aria-busy');
      }
    });
  </script>
</body>
</html>
