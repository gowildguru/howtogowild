name: Test calendar and schedule behavior

on:
  pull_request:
    paths:
      - dashboard.js
      - style.css
      - site-nav.js
      - site-nav.css
      - search.js
      - tools.js
      - faq-booking.js
      - "**/*.html"
      - tests/calendar-policy.test.mjs
      - scripts/build-schedule.mjs
      - tests/schedule-efficiency.test.mjs
      - .github/workflows/test-schedule.yml
  push:
    branches: [main]
    paths:
      - dashboard.js
      - style.css
      - site-nav.js
      - site-nav.css
      - search.js
      - tools.js
      - faq-booking.js
      - "**/*.html"
      - tests/calendar-policy.test.mjs
      - scripts/build-schedule.mjs
      - tests/schedule-efficiency.test.mjs
      - .github/workflows/test-schedule.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check dashboard.js
      - run: node --check site-nav.js
      - run: node --check search.js
      - run: node --check tools.js
      - run: node --check faq-booking.js
      - run: node --check scripts/build-schedule.mjs
      - run: node --test tests/*.test.mjs

