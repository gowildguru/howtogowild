function tomorrowISO() {
  const now = new Date();

  const tomorrow = new Date(
    Date.UTC(
      now.getUTCFullYear(),
      now.getUTCMonth(),
      now.getUTCDate() + 1
    )
  );

  return tomorrow
    .toISOString()
    .slice(0, 10);
}


const departDate =
  tomorrowISO();


const sleep =
  milliseconds =>
    new Promise(
      resolve =>
        setTimeout(
          resolve,
          milliseconds
        )
    );


async function lookupRoute(
  origin,
  destination
) {

  for (
    let attempt = 1;
    attempt <= 2;
    attempt++
  ) {

    try {

      const response =
        await fetch(
          WORKER_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                origin,
                destination,
                departDate
              }),

            signal:
              AbortSignal.timeout(
                REQUEST_TIMEOUT_MS
              )
          }
        );


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }


      const data =
        await response.json();


      return (
        data.flights || []
      )

        .filter(
          flight =>
            Array.isArray(
              flight.flights
            ) &&
            flight.flights.length === 1
        )

        .map(
          flight => ({
            destination,

            departureTime:
              flight.departureTime,

            flightNumber:
              String(
                flight.flights[0]
              )
          })
        );


    } catch (error) {

      console.warn(
        `${origin}-${destination} attempt ${attempt} failed:`,
        error.message
      );


      if (attempt === 2) {

        console.warn(
          `${origin}-${destination}: giving up after 2 attempts`
        );

        return [];

      }


      await sleep(
        RETRY_DELAY_MS
      );

    }

  }

}


async function processInBatches(
  jobs,
  concurrency
) {

  const results = [];


  for (
    let i = 0;
    i < jobs.length;
    i += concurrency
  ) {

    const batch =
      jobs.slice(
        i,
        i + concurrency
      );


    const batchResults =
      await Promise.all(
        batch.map(
          job =>
            lookupRoute(
              job.origin,
              job.destination
            )
        )
      );


    for (
      let j = 0;
      j < batch.length;
      j++
    ) {

      results.push({
        ...batch[j],

        flights:
          batchResults[j]
      });

    }


    console.log(
      `Processed ${Math.min(
        i + concurrency,
        jobs.length
      )}/${jobs.length} route lookups`
    );

  }


  return results;

}


async function main() {

  const jobs = [];


  for (
    const [
      origin,
      destinations
    ] of Object.entries(
      frontierRoutes
    )
  ) {

    for (
      const destination of
      destinations
    ) {

      jobs.push({
        origin,
        destination
      });

    }

  }


  console.log(
    `Building Frontier snapshot for ${departDate}`
  );

  console.log(
    `${jobs.length} nonstop route lookups`
  );


  const routeResults =
    await processInBatches(
      jobs,
      CONCURRENCY
    );


  const airports = {};


  for (
    const origin of
    Object.keys(
      frontierRoutes
    )
  ) {

    airports[origin] = [];

  }


  let flightCount = 0;


  for (
    const result of
    routeResults
  ) {

    if (
      !result.flights.length
    ) {
      continue;
    }


    airports[
      result.origin
    ].push(
      ...result.flights
    );


    flightCount +=
      result.flights.length;

  }


  for (
    const flights of
    Object.values(
      airports
    )
  ) {

    flights.sort(
      (a, b) =>
        String(
          a.departureTime
        ).localeCompare(
          String(
            b.departureTime
          )
        )
    );

  }


  const snapshot = {

    date:
      departDate,

    generatedAt:
      new Date()
        .toISOString(),

    routeLookups:
      jobs.length,

    flightCount,

    airports

  };


  const dataDirectory =
    path.resolve(
      "data"
    );


  await fs.mkdir(
    dataDirectory,
    {
      recursive: true
    }
  );


  const filePath =
    path.join(
      dataDirectory,
      `${departDate}.json`
    );


  await fs.writeFile(
    filePath,

    JSON.stringify(
      snapshot,
      null,
      2
    ) + "\n",

    "utf8"
  );


  console.log(
    `Saved ${flightCount} nonstop departures to ${filePath}`
  );

}


main()
  .catch(
    error => {

      console.error(
        error
      );

      process.exitCode = 1;

    }
  );
